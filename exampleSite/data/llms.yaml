# Machine-readable index (/llms.txt) and native source publishing.
#
# ON HERE, OFF EVERYWHERE ELSE. This is the example site, so the feature runs
# as a live demonstration: the /llms.txt and /source/ output published from
# this file is the demo. Toph ships no data file at the theme root, so a
# downstream site stays opted out until it adds one of its own.
#
# Copy this file to data/llms.yaml in your site and edit the sections below.
# Schema and behaviour: README.md, "Machine-readable index and source files".

enabled: true

# The human-facing index. Only one language is indexed; the source files
# themselves can still be published for every language.
index:
  enabled: true
  language: en
  # Defaults to the site title when omitted.
  title: Example Hugo site with Toph theme
  summary: A one-line description of the site, shown as a blockquote.
  intro: |
    Replace this paragraph with whatever a reader should know before using
    this index. It is rendered as plain text, not Markdown prose, so keep it
    short.
  target_bytes: 20000
  max_bytes: 100000

# Unmodified copies of every published Markdown and AsciiDoc file. Change
# `prefix` if `source/` collides with something your site already serves.
sources:
  enabled: true
  prefix: source
  # "all", or a list of language codes such as [en, ar].
  languages: all
  # Bare section names, e.g. [footer], to withhold a whole section. Note that
  # hide_sitemap and taxonomy_exclude are NOT consulted here.
  exclude_sections: []
  # Bare page paths, e.g. [about-me], to withhold individual pages.
  exclude_pages: []

# Ordered index sections. Each section uses exactly one selector:
#   pages:    an ordered list of logical page paths, kept as written
#   section:  a section name; its pages newest first
#   taxonomy: a taxonomy name; its terms busiest first
# `featured` is an ordered list of page paths that always lead a section.
sections:
  - title: Pages
    pages:
      - /

  - title: Projects
    section: projects

  - title: Writing
    section: blog
    featured: []
    limit: 10

  - title: Topics
    taxonomy: categories
    limit: 8

optional:
  - title: Full blog archive
    page: /blog
  - title: Sitemap
    url: sitemap.xml
  - title: RSS feed
    url: rss/index.xml
