# Neutral/utility CSS custom properties for the Toph theme.
#
# Group and key are joined with a hyphen to form the variable name; the
# light: and dark: subtrees emit the same names into different scopes:
#   text.light.body → --text-body in :root
#   text.dark.body  → --text-body in :root[data-bs-theme="dark"]
#
# Light neutrals are injected into the stylesheet at build time via
# css.Build vars (@import 'hugo:vars'). Dark values are emitted as an
# inline <style> block in head.html.
#
# Most dark values are derived from their light peers via color-mix(),
# computed once and stored as literal hex here (not as live color-mix()
# strings) to keep this format uniform. A few (nav.*, bg.modal-overlay)
# are shared unchanged between modes because they already meet contrast.
#
# Brand colors and fonts are per-site config (params.colors,
# params.fonts), injected separately in head.html.
#
# To override a value, add a data/style.yaml to your site root; Hugo
# merges it over this one. Keep the light:/dark: nesting — a flat
# text.body key is silently ignored.

text:
  light:
    body: "#330000"
    muted: "#555"
    secondary: "#767676"
    link: "#003366"
    link-hover: "#003d82"
    anchor: "#959083"
  dark:
    body: "#B7A5A5"
    muted: "#A9A9A9"
    secondary: "#A9A9A9"
    link: "#97ACC1"
    link-hover: "#A4BAD2"
    anchor: "#ADA99F"

border:
  light:
    light: "#e0ddd5"
    medium: "#d0cdc5"
    lighter: "#e8e5dd"
    toc: "#a2a9b1"
  dark:
    light: "#706E6A"
    medium: "#686662"
    lighter: "#74726E"
    toc: "#515458"

bg:
  light:
    white: "#fff"
    toc: "#f8f9fa"
    caption: "#faf9f6"
    hover: "#f5f4f0"
    card-hover: "#f5f0fa"
    card-active: "#ece4f4"
    modal-overlay: "rgba(0, 0, 0, 0.95)"
  dark:
    white: "#1F1F1F"
    toc: "#1E1E1E"
    caption: "#1E1E1E"
    hover: "#2C2C2B"
    card-hover: "#2C2B2D"
    card-active: "#2A292C"
    modal-overlay: "rgba(0, 0, 0, 0.95)"

nav:
  light:
    hover-bg: royalblue
    hover-decoration: skyblue
  dark:
    hover-bg: royalblue
    hover-decoration: skyblue

shadow:
  light:
    navbar: "rgba(0, 0, 0, 0.2)"
    card: "rgba(0, 0, 0, 0.08)"
  dark:
    navbar: "rgba(0, 0, 0, 0.5)"
    card: "rgba(0, 0, 0, 0.3)"

admonition:
  light:
    bg-note: "#f0f4f8"
    bg-tip: "#f0f6f0"
    bg-warning: "#fef7ed"
    bg-caution: "#fef2f0"
    bg-important: "#f4f0f8"
    border-note: "#8ba4b8"
    border-tip: "#7da47d"
    border-warning: "#c9a048"
    border-caution: "#c07060"
    border-important: "#8a70a8"
    icon-note: "#5a7d99"
    icon-tip: "#4a7a4a"
    icon-warning: "#9a7830"
    icon-caution: "#a05040"
    icon-important: "#6a4a8a"
  dark:
    bg-note: "#1a2530"
    bg-tip: "#1a2419"
    bg-warning: "#2e2415"
    bg-caution: "#2e1b17"
    bg-important: "#241f2e"
    border-note: "#AEBFCD"
    border-tip: "#A4BFA4"
    border-warning: "#D9BC7F"
    border-caution: "#D39B90"
    border-important: "#AD9BC2"
    icon-note: "#8CA4B8"
    icon-tip: "#80A280"
    icon-warning: "#B8A06E"
    icon-caution: "#BC8479"
    icon-important: "#9780AD"

# Bootstrap's own --bs-* variables, re-pointed at the theme palette so
# Bootstrap-native components (.card, .list-group-item, .accordion)
# render on our surfaces instead of Bootstrap's lighter, bluer defaults.
#
# INVARIANT: every key under light: must also appear under dark:.
# main.css (:root) loads after bootstrap.min.css ([data-bs-theme=dark]).
# Both selectors share specificity (0,1,0), so an unpaired light token
# in :root outranks Bootstrap's dark rule in every dark mode — not only
# on the no-JS path where [data-bs-theme=dark] is absent.
#
# Surface variables are dark-only (Bootstrap's light defaults suit our
# light palette). Both background AND foreground tokens are redefined
# so components render with readable text; overriding only backgrounds
# previously left light text on dark surfaces (~1:1) when JS was off.
# tertiary-bg (hover) and secondary-bg (active) map to card-hover/card-active.
#
# code-color is overridden in both modes: Bootstrap's #d63384 clears
# 4.5:1 only on pure white, falling to 4.00:1 on linen and 4.27:1 on
# --bg-toc. Darkened to #a52a63 to hold 6.00:1 on linen and 5.45:1 on
# our darkest light neutral surface. The dark value (#e685b5) is
# Bootstrap 5.3.8's own default, restated to satisfy the invariant above.
bs:
  light:
    code-color: "#a52a63"
  dark:
    body-bg: "var(--bg-white)"
    tertiary-bg: "var(--bg-card-hover)"
    secondary-bg: "var(--bg-card-active)"
    body-color: "var(--text-body)"
    secondary-color: "var(--text-secondary)"
    tertiary-color: "var(--text-muted)"
    emphasis-color: "var(--text-body)"
    border-color: "var(--border-light)"
    code-color: "#e685b5"
