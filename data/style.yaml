# Neutral/utility CSS custom properties for the Toph theme.
#
# Each top-level key is a group; each group has a `light:` and `dark:`
# tree of the same keys. Keys are flattened to CSS variable names by
# joining group and key with a hyphen:
#   text.light.body → --text-body (in the base :root block)
#   text.dark.body  → --text-body (in the :root[data-bs-theme="dark"] block)
#
# Most dark values are derived from their light peers via color-mix(),
# computed once and stored as literal hex here (not as live color-mix()
# strings) to keep this file's format uniform — these are fixed theme
# values, not per-site config, so there's no runtime-adjustability
# benefit to live computation the way there is for brand colors in
# head.html. A few values are intentionally shared unchanged between
# light and dark (nav.*, bg.modal-overlay) because they already meet
# contrast on both backgrounds.
#
# The `bs:` group is dark-only: it re-points Bootstrap's own surface
# variables (--bs-body-bg and friends) at the theme's dark card palette,
# so Bootstrap-native components (.card, .list-group-item, .accordion)
# render on our controlled surfaces instead of Bootstrap's lighter,
# bluer defaults (#212529+). Light mode keeps Bootstrap's defaults.
#
# Brand colors and fonts are set per-site via Hugo config
# (params.colors, params.fonts). Hugo injects all values into the
# stylesheet at build time via css.Build vars.
#
# To override a value for your site, create a matching
# data/style.yaml in your site root — Hugo merges theme and
# site data files, with the site taking precedence. Overrides must
# use the same light:/dark: nesting (e.g. text.light.body), not a
# flat text.body key — the stylesheet only reads values under each
# group's light:/dark: subtree, so a flat override is silently ignored.

text:
  light:
    body: "#330000"
    muted: "#555"
    secondary: "#767676"
    link: "#003366"
    link-hover: "#003d82"
    anchor: "#959083"
  dark:
    body: "#B7A5A5"
    muted: "#A9A9A9"
    secondary: "#A9A9A9"
    link: "#97ACC1"
    link-hover: "#A4BAD2"
    anchor: "#ADA99F"

border:
  light:
    light: "#e0ddd5"
    medium: "#d0cdc5"
    lighter: "#e8e5dd"
    toc: "#a2a9b1"
  dark:
    light: "#706E6A"
    medium: "#686662"
    lighter: "#74726E"
    toc: "#515458"

bg:
  light:
    white: "#fff"
    toc: "#f8f9fa"
    caption: "#faf9f6"
    hover: "#f5f4f0"
    card-hover: "#f5f0fa"
    card-active: "#ece4f4"
    modal-overlay: "rgba(0, 0, 0, 0.95)"
  dark:
    white: "#1F1F1F"
    toc: "#1E1E1E"
    caption: "#1E1E1E"
    hover: "#2C2C2B"
    card-hover: "#2C2B2D"
    card-active: "#2A292C"
    modal-overlay: "rgba(0, 0, 0, 0.95)"

nav:
  light:
    hover-bg: royalblue
    hover-decoration: skyblue
  dark:
    hover-bg: royalblue
    hover-decoration: skyblue

shadow:
  light:
    navbar: "rgba(0, 0, 0, 0.2)"
    card: "rgba(0, 0, 0, 0.08)"
  dark:
    navbar: "rgba(0, 0, 0, 0.5)"
    card: "rgba(0, 0, 0, 0.3)"

admonition:
  light:
    bg-note: "#f0f4f8"
    bg-tip: "#f0f6f0"
    bg-warning: "#fef7ed"
    bg-caution: "#fef2f0"
    bg-important: "#f4f0f8"
    border-note: "#8ba4b8"
    border-tip: "#7da47d"
    border-warning: "#c9a048"
    border-caution: "#c07060"
    border-important: "#8a70a8"
    icon-note: "#5a7d99"
    icon-tip: "#4a7a4a"
    icon-warning: "#9a7830"
    icon-caution: "#a05040"
    icon-important: "#6a4a8a"
  dark:
    bg-note: "#1a2530"
    bg-tip: "#1a2419"
    bg-warning: "#2e2415"
    bg-caution: "#2e1b17"
    bg-important: "#241f2e"
    border-note: "#AEBFCD"
    border-tip: "#A4BFA4"
    border-warning: "#D9BC7F"
    border-caution: "#D39B90"
    border-important: "#AD9BC2"
    icon-note: "#8CA4B8"
    icon-tip: "#80A280"
    icon-warning: "#B8A06E"
    icon-caution: "#BC8479"
    icon-important: "#9780AD"

# Bootstrap surface overrides (dark-only — no light: subtree). Bootstrap
# 5.3's dark component styles (.card, .list-group-item, .accordion) are
# gated on the [data-bs-theme=dark] attribute, which only the toggle's
# JS sets. On the no-JS prefers-color-scheme fallback that attribute is
# absent, so those components fall back to Bootstrap's *light* rules,
# which read the same --bs-* tokens redefined here. Redefine the full
# surface token set — background AND foreground — so both the attribute
# scope and the no-JS scope render these components on the theme's dark
# card palette with readable text. Overriding only the backgrounds left
# light --bs-body-color text on a dark surface (~1:1) when JS was off.
#
# Values reference the theme's own dark palette so the two stay in sync.
# tertiary-bg is Bootstrap's hover surface and secondary-bg its active
# surface; they map to card-hover/card-active to match the bespoke
# components' "hover lighter, active darker" convention.
bs:
  dark:
    body-bg: "var(--bg-white)"
    tertiary-bg: "var(--bg-card-hover)"
    secondary-bg: "var(--bg-card-active)"
    body-color: "var(--text-body)"
    secondary-color: "var(--text-secondary)"
    tertiary-color: "var(--text-muted)"
    emphasis-color: "var(--text-body)"
    border-color: "var(--border-light)"
